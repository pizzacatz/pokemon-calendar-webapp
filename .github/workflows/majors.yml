name: Refresh majors

# The five pokedata feeds behind this calendar carry locals only — Cups,
# Challenges and Prereleases. Majors come from the official events feed and are
# scraped here on a schedule, the same pattern pokemon-majors-map uses: refresh
# daily, commit the result, and let the static site read a versioned file rather
# than scrape at runtime.
on:
  schedule:
    # Daily, off the hour to be polite to the source.
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/majors.yml'
      - 'scraper/**'

permissions:
  contents: write

concurrency:
  group: majors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the date parser
        run: node scraper/majors.test.mjs

      - name: Read the official events feed
        run: node scraper/majors.mjs

      - name: Commit if the schedule changed
        run: |
          if git diff --quiet -- data/majors.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/majors.json
          git commit -m "data: refresh majors ($(date -u +%Y-%m-%d))"
          git push
