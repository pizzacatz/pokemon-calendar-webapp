<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Events Calendar</title>
  <meta name="description" content="Competitive Pokémon TCG, VGC and GO events — cups, challenges, prereleases and community meetups." />

  <!-- FullCalendar v6 (standard MIT bundle) + Google Calendar plugin, pinned, via CDN. -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.21/index.global.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Pokémon Events Calendar</h1>
    <p class="tagline">Cups · Challenges · Prereleases · Community</p>
  </header>

  <main class="app-main">
    <!-- Custom filter panel (no built-in FullCalendar widget exists; this is custom code). -->
    <section class="filter-panel" aria-label="Filter event categories">
      <button type="button" id="filter-toggle" class="filter-toggle" aria-expanded="true" aria-controls="filter-list">
        Filter categories
      </button>
      <div id="filter-list" class="filter-list">
        <!-- One checkbox per category, injected by app.js. -->
      </div>
    </section>

    <div id="calendar" class="calendar"></div>
  </main>

  <!-- In-page event detail popup (custom; shown on event click). -->
  <div id="event-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div class="modal-swatch" id="modal-swatch"></div>
      <h2 id="modal-title" class="modal-title"></h2>
      <dl class="modal-details">
        <div class="modal-row" id="modal-when-row">
          <dt>When</dt><dd id="modal-when"></dd>
        </div>
        <div class="modal-row" id="modal-where-row" hidden>
          <dt>Where</dt><dd id="modal-where"></dd>
        </div>
        <div class="modal-row" id="modal-link-row" hidden>
          <dt>Info</dt><dd id="modal-link" class="modal-desc"></dd>
        </div>
      </dl>
      <div id="modal-media" class="modal-media"></div>
    </div>
  </div>

  <footer class="app-footer">
    <p>Times shown in US Eastern (America/New_York).</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
