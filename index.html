<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Events Calendar</title>
  <meta name="description" content="Competitive Pokémon TCG, VGC and GO events — cups, challenges, prereleases and community meetups." />

  <!-- FullCalendar v6 (standard MIT bundle) + Google Calendar plugin, pinned, via CDN. -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.21/index.global.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Pokémon Events Calendar</h1>
    <p class="tagline">Cups · Challenges · Prereleases · Community</p>
  </header>

  <main class="app-main">
    <!-- Custom filter panel (no built-in FullCalendar widget exists; this is custom code). -->
    <section class="filter-panel" aria-label="Filter event categories">
      <div id="filter-list" class="filter-list">
        <!-- "All" + one filter chip per category, injected by app.js. -->
      </div>
      <p id="filter-empty" class="filter-empty" hidden>No events match your filters — tap <strong>All</strong> to reset.</p>
    </section>

    <div id="calendar" class="calendar"></div>
  </main>

  <!-- In-page event detail popup (custom; shown on event click). -->
  <div id="event-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-back" id="modal-back" hidden>‹ Back</button>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div class="modal-swatch" id="modal-swatch"></div>
      <h2 id="modal-title" class="modal-title"></h2>
      <dl class="modal-details">
        <div class="modal-row" id="modal-when-row">
          <dt>When</dt><dd id="modal-when"></dd>
        </div>
        <div class="modal-row" id="modal-where-row" hidden>
          <dt>Where</dt><dd id="modal-where"></dd>
        </div>
        <div class="modal-row" id="modal-link-row" hidden>
          <dt>Details</dt><dd id="modal-link" class="modal-desc"></dd>
        </div>
      </dl>
      <!-- Copy-to-clipboard actions: plain text, and Discord-flavoured markdown. -->
      <div class="modal-actions">
        <button type="button" class="modal-action" id="modal-copy" title="Copy event details" aria-label="Copy event details">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <button type="button" class="modal-action" id="modal-copy-discord" title="Copy for Discord" aria-label="Copy event details formatted for Discord">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
            <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
        </button>
        <span class="modal-copy-status" id="modal-copy-status" role="status" aria-live="polite"></span>
      </div>
      <div id="modal-media" class="modal-media"></div>
      <button type="button" class="modal-close-bottom" id="modal-close-bottom">Close</button>
    </div>
  </div>

  <!-- Day event-list modal (mobile month view: tap a day to see its events). -->
  <div id="day-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="day-modal-title">
      <button type="button" class="modal-close" id="day-modal-close" aria-label="Close">×</button>
      <h2 id="day-modal-title" class="modal-title"></h2>
      <div id="day-modal-list" class="day-list"></div>
      <button type="button" class="modal-close-bottom" id="day-modal-close-bottom">Close</button>
    </div>
  </div>

  <footer class="app-footer">
    <p>Times shown in US Eastern (America/New_York).</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
